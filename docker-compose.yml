version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: furniture_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: furniture_store
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: furniture_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=furniture_store
      - DB_DIALECT=mysql
      - JWT_SECRET=my_super_secret_key_123
      - JWT_EXPIRES_IN=7d
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: furniture_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
